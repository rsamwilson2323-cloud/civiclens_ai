<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CivicLens AI — See the Problem. Understand the Risk. Drive the Action.</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛰️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --bg:#0a0d16;
  --bg-elev:#0f1424;
  --surface:#141a2e;
  --surface-2:#1a2138;
  --border:#242c47;
  --text:#e9ecf6;
  --text-dim:#9aa3bf;
  --text-faint:#5f6a8c;
  --blue:#3b6bff;
  --blue-soft:#3b6bff26;
  --violet:#8b5cf6;
  --violet-soft:#8b5cf626;
  --cyan:#22d3c9;
  --cyan-soft:#22d3c926;
  --crit:#ff5470;
  --high:#ff9f43;
  --med:#f2cd5c;
  --low:#3ecf8e;
  --radius:14px;
  --radius-sm:8px;
  --shadow:0 20px 60px -20px rgba(0,0,0,.6);
  --font:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  --mono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;font-family:var(--font);background:radial-gradient(ellipse 1200px 800px at 15% -10%, #1a2560 0%, transparent 55%),
  radial-gradient(ellipse 1000px 700px at 100% 0%, #2a1a5e33 0%, transparent 50%),var(--bg);
  color:var(--text);-webkit-font-smoothing:antialiased;min-height:100vh;
}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;border-radius:4px;}
img{max-width:100%;display:block;}
.container{max-width:1220px;margin:0 auto;padding:0 24px;}
::selection{background:var(--blue-soft);}

/* NAV */
.navbar{position:sticky;top:0;z-index:100;backdrop-filter:blur(16px);background:rgba(10,13,22,.78);border-bottom:1px solid var(--border);}
.navbar .container{display:flex;align-items:center;justify-content:space-between;height:68px;}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;letter-spacing:-.01em;}
.brand-mark{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--blue),var(--violet));display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.nav-links{display:flex;gap:4px;align-items:center;}
.nav-links a{padding:9px 14px;border-radius:8px;font-size:14px;font-weight:500;color:var(--text-dim);transition:.15s;}
.nav-links a:hover{color:var(--text);background:var(--surface);}
.nav-links a.active{color:var(--text);background:var(--surface-2);}
.nav-cta{display:flex;gap:10px;align-items:center;}
.hamburger{display:none;background:none;border:1px solid var(--border);color:var(--text);width:40px;height:40px;border-radius:8px;align-items:center;justify-content:center;font-size:18px;}
.mobile-menu{display:none;flex-direction:column;padding:8px 24px 18px;border-bottom:1px solid var(--border);background:var(--bg-elev);}
.mobile-menu a{padding:12px 4px;border-bottom:1px solid var(--border);color:var(--text-dim);font-size:15px;font-weight:500;}
.mobile-menu a:last-child{border-bottom:none;}
@media(max-width:880px){
  .nav-links{display:none;}
  .hamburger{display:flex;}
  .nav-cta .btn-label{display:none;}
}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:10px;font-weight:600;font-size:14.5px;border:1px solid transparent;transition:.15s;white-space:nowrap;}
.btn-primary{background:linear-gradient(135deg,var(--blue),#5b7fff);color:#fff;box-shadow:0 8px 24px -8px #3b6bff88;}
.btn-primary:hover{filter:brightness(1.08);transform:translateY(-1px);}
.btn-ghost{background:var(--surface);border-color:var(--border);color:var(--text);}
.btn-ghost:hover{background:var(--surface-2);}
.btn-outline{background:transparent;border-color:var(--border);color:var(--text-dim);}
.btn-outline:hover{color:var(--text);border-color:var(--blue);}
.btn-sm{padding:8px 14px;font-size:13px;}
.btn-danger{background:transparent;border-color:#ff547033;color:var(--crit);}
.btn-danger:hover{background:#ff547014;}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none!important;}
.btn-block{width:100%;}

/* PAGE / SECTION */
.page{padding:56px 0 90px;min-height:70vh;animation:fadeIn .35s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
.section-head{margin-bottom:34px;}
.eyebrow{color:var(--cyan);font-size:13px;font-weight:600;margin-bottom:10px;}
h1,h2,h3{margin:0;letter-spacing:-.02em;line-height:1.1;}
.page-title{font-size:34px;font-weight:800;}
.page-sub{color:var(--text-dim);font-size:15.5px;margin-top:8px;max-width:560px;line-height:1.55;}

/* CARD */
.card{background:linear-gradient(180deg,var(--surface),var(--bg-elev));border:1px solid var(--border);border-radius:var(--radius);}
.glass{background:rgba(20,26,46,.55);backdrop-filter:blur(10px);border:1px solid var(--border);}

/* HERO */
.hero{padding:76px 0 40px;position:relative;overflow:hidden;}
.hero-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:56px;align-items:center;}
@media(max-width:960px){.hero-grid{grid-template-columns:1fr;gap:40px;}}
.hero h1{font-size:52px;font-weight:800;}
@media(max-width:600px){.hero h1{font-size:36px;}}
.hero-accent{background:linear-gradient(120deg,var(--cyan),var(--blue) 60%,var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent;}
.hero p.lede{color:var(--text-dim);font-size:17px;line-height:1.65;margin:20px 0 30px;max-width:480px;}
.hero-actions{display:flex;gap:14px;flex-wrap:wrap;}
.flow-card{padding:26px;}
.flow-step{display:flex;align-items:center;gap:14px;padding:14px 4px;position:relative;}
.flow-step + .flow-step{border-top:1px dashed var(--border);}
.flow-num{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;background:var(--surface-2);border:1px solid var(--border);}
.flow-step:nth-child(1) .flow-num{background:var(--blue-soft);}
.flow-step:nth-child(2) .flow-num{background:var(--violet-soft);}
.flow-step:nth-child(3) .flow-num{background:var(--cyan-soft);}
.flow-step:nth-child(4) .flow-num{background:#3ecf8e26;}
.flow-step:nth-child(5) .flow-num{background:#ff9f4326;}
.flow-label{font-weight:600;font-size:15px;}
.flow-desc{color:var(--text-faint);font-size:12.5px;margin-top:2px;}

.feature-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:56px;}
@media(max-width:860px){.feature-grid{grid-template-columns:1fr;}}
.feature-card{padding:26px;}
.feature-icon{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;margin-bottom:16px;}
.feature-card:nth-child(1) .feature-icon{background:var(--blue-soft);}
.feature-card:nth-child(2) .feature-icon{background:var(--violet-soft);}
.feature-card:nth-child(3) .feature-icon{background:var(--cyan-soft);}
.feature-card h3{font-size:17px;font-weight:700;margin-bottom:8px;}
.feature-card p{color:var(--text-dim);font-size:14px;line-height:1.6;margin:0;}

.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:56px;}
@media(max-width:700px){.stats-row{grid-template-columns:repeat(2,1fr);}}
.stat-box{padding:22px;text-align:left;}
.stat-num{font-size:32px;font-weight:800;font-family:var(--mono);}
.stat-label{color:var(--text-dim);font-size:13px;margin-top:6px;}

/* STEP WIZARD */
.wizard-track{display:flex;align-items:center;gap:0;margin-bottom:38px;max-width:640px;}
.wz-step{display:flex;align-items:center;gap:10px;flex:1;}
.wz-dot{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:12.5px;font-weight:600;color:var(--text-faint);flex-shrink:0;transition:.2s;}
.wz-step.done .wz-dot{background:var(--blue);border-color:var(--blue);color:#fff;}
.wz-step.active .wz-dot{border-color:var(--cyan);color:var(--cyan);box-shadow:0 0 0 4px var(--cyan-soft);}
.wz-label{font-size:13px;color:var(--text-faint);font-weight:600;}
.wz-step.active .wz-label,.wz-step.done .wz-label{color:var(--text);}
.wz-line{flex:1;height:1.5px;background:var(--border);margin:0 2px;}
.wz-step.done + .wz-line{background:var(--blue);}

.report-panel{max-width:640px;}
.dropzone{border:1.5px dashed var(--border);border-radius:var(--radius);padding:44px 20px;text-align:center;background:var(--surface);transition:.15s;cursor:pointer;}
.dropzone:hover,.dropzone.drag{border-color:var(--cyan);background:var(--cyan-soft);}
.dropzone .dz-icon{font-size:30px;margin-bottom:10px;}
.dropzone p{margin:4px 0;color:var(--text-dim);font-size:14px;}
.dropzone .dz-sub{color:var(--text-faint);font-size:12.5px;}
.preview-wrap{position:relative;border-radius:var(--radius);overflow:hidden;border:1px solid var(--border);}
.preview-wrap img{width:100%;max-height:340px;object-fit:cover;}
.preview-remove{position:absolute;top:10px;right:10px;background:rgba(10,13,22,.75);border:1px solid var(--border);color:#fff;width:32px;height:32px;border-radius:8px;}

.field{margin-bottom:18px;}
.field label{display:block;font-size:13px;font-weight:600;color:var(--text-dim);margin-bottom:7px;}
.field textarea,.field input[type=text]{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px;color:var(--text);font-family:inherit;font-size:14.5px;resize:vertical;}
.field textarea:focus,.field input:focus{border-color:var(--blue);}
.loc-row{display:flex;gap:10px;flex-wrap:wrap;}
.loc-chip{font-family:var(--mono);font-size:12.5px;color:var(--text-dim);background:var(--surface);border:1px solid var(--border);padding:8px 12px;border-radius:8px;}

.ai-scan{padding:32px;text-align:center;}
.ai-scan .pulse{width:64px;height:64px;border-radius:50%;background:radial-gradient(circle,var(--blue-soft),transparent 70%);display:flex;align-items:center;justify-content:center;margin:0 auto 18px;font-size:28px;animation:pulseAnim 1.6s ease-in-out infinite;}
@keyframes pulseAnim{0%,100%{transform:scale(1);}50%{transform:scale(1.12);}}
.scan-log{text-align:left;max-width:340px;margin:18px auto 0;font-family:var(--mono);font-size:12.5px;color:var(--text-faint);}
.scan-log div{padding:5px 0;opacity:0;animation:logIn .3s forwards;}
@keyframes logIn{to{opacity:1;}}
.scan-log div.ok::before{content:"✓ ";color:var(--low);}

.result-card{padding:24px;}
.result-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;}
.result-issue{font-size:22px;font-weight:800;}
.badge{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:99px;font-size:12px;font-weight:700;letter-spacing:.02em;}
.badge-crit{background:#ff547022;color:var(--crit);}
.badge-high{background:#ff9f4322;color:var(--high);}
.badge-med{background:#f2cd5c22;color:var(--med);}
.badge-low{background:#3ecf8e22;color:var(--low);}
.badge-demo{background:var(--violet-soft);color:var(--violet);}
.metric-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:20px 0;}
@media(max-width:560px){.metric-grid{grid-template-columns:1fr 1fr;}}
.metric{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;}
.metric-label{font-size:11.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.05em;}
.metric-val{font-size:19px;font-weight:800;font-family:var(--mono);margin-top:4px;}
.risk-bar-track{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin-top:6px;}
.risk-bar-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--low),var(--med),var(--high),var(--crit));}
.desc-block{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;margin-top:16px;font-size:14px;line-height:1.65;color:var(--text-dim);}
.desc-block b{color:var(--text);}
.tooltip-note{font-size:12px;color:var(--text-faint);margin-top:10px;display:flex;gap:6px;align-items:flex-start;}

.related-box{border:1px solid var(--violet);background:var(--violet-soft);border-radius:12px;padding:18px;margin-top:20px;}
.related-box h4{margin:0 0 6px;font-size:14.5px;}
.related-box p{margin:0 0 12px;font-size:13px;color:var(--text-dim);}

.confirm-list{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media(max-width:540px){.confirm-list{grid-template-columns:1fr;}}
.confirm-item{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px;}
.confirm-item .k{font-size:11.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.05em;}
.confirm-item .v{font-size:14.5px;font-weight:600;margin-top:4px;}

.success-wrap{text-align:center;padding:60px 20px;max-width:480px;margin:0 auto;}
.success-badge{width:74px;height:74px;border-radius:50%;background:#3ecf8e22;color:var(--low);display:flex;align-items:center;justify-content:center;font-size:34px;margin:0 auto 20px;}
.success-id{font-family:var(--mono);font-size:22px;font-weight:700;color:var(--cyan);margin:14px 0 4px;}
.wizard-nav{display:flex;justify-content:space-between;margin-top:28px;gap:12px;}

/* MAP */
.map-page{padding-top:0;}
.map-toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:18px 0;}
.chip{padding:7px 13px;border-radius:99px;border:1px solid var(--border);background:var(--surface);font-size:12.5px;font-weight:600;color:var(--text-dim);}
.chip.active{background:var(--blue);border-color:var(--blue);color:#fff;}
.chip-group{display:flex;gap:6px;flex-wrap:wrap;}
#map{height:560px;border-radius:var(--radius);border:1px solid var(--border);z-index:1;}
.map-popup{font-family:var(--font);}
.map-popup h4{margin:0 0 4px;font-size:14px;}
.map-popup .popup-meta{font-size:12px;color:#555;margin:3px 0;}
.leaflet-popup-content-wrapper{background:var(--surface);color:var(--text);border-radius:10px;}
.leaflet-popup-tip{background:var(--surface);}
.map-popup a.view-link{color:var(--blue);font-weight:600;font-size:12.5px;}

/* MY REPORTS */
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:32px;}
@media(max-width:700px){.kpi-row{grid-template-columns:1fr 1fr;}}
.kpi{padding:18px;}
.kpi .num{font-size:26px;font-weight:800;font-family:var(--mono);}
.kpi .lbl{color:var(--text-dim);font-size:12.5px;margin-top:4px;}
.report-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px;}
.report-card{padding:18px;cursor:pointer;transition:.15s;}
.report-card:hover{border-color:var(--blue);transform:translateY(-2px);}
.rc-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.rc-id{font-family:var(--mono);font-size:11.5px;color:var(--text-faint);}
.rc-issue{font-size:16px;font-weight:700;margin:2px 0 8px;}
.rc-meta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--text-dim);margin-top:10px;}
.status-pill{padding:4px 10px;border-radius:99px;font-size:11px;font-weight:700;background:var(--surface-2);color:var(--text-dim);}
.status-Resolved{background:#3ecf8e22;color:var(--low);}
.status-InProgress,.status-In_Progress{background:var(--blue-soft);color:#7aa0ff;}
.status-Assigned{background:var(--violet-soft);color:var(--violet);}
.status-Verified{background:var(--cyan-soft);color:var(--cyan);}
.status-Reported{background:var(--surface-2);color:var(--text-dim);}

.timeline{display:flex;justify-content:space-between;margin:24px 0;position:relative;}
.timeline::before{content:"";position:absolute;top:13px;left:0;right:0;height:2px;background:var(--border);}
.tl-step{position:relative;text-align:center;flex:1;}
.tl-dot{width:26px;height:26px;border-radius:50%;background:var(--bg-elev);border:2px solid var(--border);margin:0 auto 8px;position:relative;z-index:1;}
.tl-step.done .tl-dot{background:var(--blue);border-color:var(--blue);}
.tl-step.current .tl-dot{background:var(--cyan);border-color:var(--cyan);box-shadow:0 0 0 4px var(--cyan-soft);}
.tl-step span{font-size:11px;color:var(--text-faint);font-weight:600;}
.tl-step.done span,.tl-step.current span{color:var(--text);}

.empty-state{text-align:center;padding:70px 20px;color:var(--text-dim);}
.empty-state .ic{font-size:40px;margin-bottom:14px;}

/* ADMIN */
.admin-header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;margin-bottom:28px;}
.admin-tabs{display:flex;gap:6px;margin-bottom:24px;border-bottom:1px solid var(--border);}
.admin-tab{padding:11px 16px;font-size:13.5px;font-weight:600;color:var(--text-faint);border-bottom:2px solid transparent;}
.admin-tab.active{color:var(--text);border-color:var(--cyan);}
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);}
table{width:100%;border-collapse:collapse;min-width:920px;}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-faint);padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--border);white-space:nowrap;}
td{padding:12px 16px;font-size:13.5px;border-bottom:1px solid var(--border);color:var(--text-dim);white-space:nowrap;}
tr:last-child td{border-bottom:none;}
tbody tr:hover{background:var(--surface);}
td.strong{color:var(--text);font-weight:600;}
.filters-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center;}
.filters-bar select,.filters-bar input{background:var(--surface);border:1px solid var(--border);color:var(--text);padding:9px 12px;border-radius:8px;font-size:13px;font-family:inherit;}
.filters-bar input{min-width:200px;}
.row-actions{display:flex;gap:6px;}
.icon-btn{width:30px;height:30px;border-radius:7px;border:1px solid var(--border);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;color:var(--text-dim);font-size:14px;}
.icon-btn:hover{color:var(--text);border-color:var(--blue);}

.analytics-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:12px;}
@media(max-width:860px){.analytics-grid{grid-template-columns:1fr;}}
.chart-card{padding:22px;}
.chart-card h3{font-size:14.5px;margin-bottom:16px;}
.bar-row{display:grid;grid-template-columns:120px 1fr 46px;align-items:center;gap:10px;margin-bottom:12px;font-size:12.5px;}
.bar-track{height:10px;background:var(--surface-2);border-radius:99px;overflow:hidden;}
.bar-fill{height:100%;border-radius:99px;}
.hotspot-list{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-top:16px;}
@media(max-width:860px){.hotspot-list{grid-template-columns:1fr;}}
.hotspot-card{padding:16px;}
.hotspot-card h4{font-size:14.5px;margin:0 0 6px;}
.hotspot-card p{font-size:12.5px;color:var(--text-faint);margin:2px 0;}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(5,7,14,.72);backdrop-filter:blur(4px);z-index:1000;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;}
.modal{background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius);max-width:640px;width:100%;padding:28px;box-shadow:var(--shadow);}
.modal-close{float:right;background:var(--surface);border:1px solid var(--border);color:var(--text-dim);width:32px;height:32px;border-radius:8px;}
.modal h3{font-size:19px;margin-bottom:6px;}
.modal img{border-radius:10px;margin:14px 0;width:100%;max-height:260px;object-fit:cover;}

/* HELP / FOOTER */
.footer{border-top:1px solid var(--border);padding:34px 0;margin-top:60px;}
.footer .container{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;color:var(--text-faint);font-size:13px;}
.help-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
@media(max-width:760px){.help-grid{grid-template-columns:1fr;}}
.faq{padding:18px 20px;}
.faq h4{font-size:14.5px;margin:0 0 8px;}
.faq p{font-size:13.5px;color:var(--text-dim);margin:0;line-height:1.6;}

<script>
/* ============================================================
   CivicLens AI — client-side data layer (localStorage "DB")
   Demo/fallback AI mode: no external network calls are made;
   analysis is generated locally so the full workflow always works.
   ============================================================ */
const STORE_KEY = 'civiclens_reports_v1';
const CONFIRM_KEY = 'civiclens_confirmed_v1';
const CATEGORIES = ['Road Infrastructure','Waste Management','Drainage','Street Lighting','Water Infrastructure','Public Safety','Obstruction','Environmental'];
const CATEGORY_ISSUES = {
  'Road Infrastructure':['Pothole','Cracked Road Surface','Collapsed Road Edge','Broken Speed Bump'],
  'Waste Management':['Garbage Accumulation','Overflowing Bin','Illegal Dumping'],
  'Drainage':['Overflowing Drain','Blocked Stormwater Drain','Open Manhole'],
  'Street Lighting':['Broken Streetlight','Non-functional Street Lamp'],
  'Water Infrastructure':['Water Leakage','Burst Pipeline','Waterlogging'],
  'Public Safety':['Fallen Tree','Damaged Public Bench','Exposed Wiring'],
  'Obstruction':['Road Obstruction','Debris on Roadway'],
  'Environmental':['Illegal Dumping Site','Standing Water / Mosquito Risk']
};
const SEVERITIES = ['Low','Medium','High','Critical'];
const SEVERITY_COLOR = {Low:'#3ecf8e',Medium:'#f2cd5c',High:'#ff9f43',Critical:'#ff5470'};
const STATUS_FLOW = ['Reported','Verified','Assigned','In Progress','Resolved'];
const DEPARTMENTS = ['Road Maintenance','Waste Management','Drainage','Electrical','Water','General'];
const DEMO_CENTER = {lat:11.0168, lng:76.9558}; // Coimbatore, TN

function uid(){return Math.random().toString(36).slice(2,9);}
function pad(n,l){return String(n).padStart(l,'0');}
function haversine(lat1,lon1,lat2,lon2){
  const R=6371000,toRad=d=>d*Math.PI/180;
  const dLat=toRad(lat2-lat1),dLon=toRad(lon2-lon1);
  const a=Math.sin(dLat/2)**2+Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(a));
}
function nextReportCode(reports){
  return 'CVL-2026-' + pad(reports.length + 1 + 100, 5);
}
function severityFromScore(s){
  if(s>=80) return 'Critical'; if(s>=60) return 'High'; if(s>=30) return 'Medium'; return 'Low';
}
function loadReports(){
  let raw = localStorage.getItem(STORE_KEY);
  if(!raw){ const seed = genSeedData(); localStorage.setItem(STORE_KEY, JSON.stringify(seed)); return seed; }
  try{ return JSON.parse(raw); }catch(e){ const seed=genSeedData(); localStorage.setItem(STORE_KEY, JSON.stringify(seed)); return seed; }
}
function saveReports(list){ localStorage.setItem(STORE_KEY, JSON.stringify(list)); }
function loadConfirmed(){ try{return JSON.parse(localStorage.getItem(CONFIRM_KEY))||{};}catch(e){return {};} }
function saveConfirmed(o){ localStorage.setItem(CONFIRM_KEY, JSON.stringify(o)); }

function genSeedData(){
  const list=[];
  const statuses=['Reported','Reported','Verified','Assigned','In Progress','In Progress','Resolved','Resolved'];
  const now=Date.now();
  for(let i=0;i<15;i++){
    const cat = CATEGORIES[i % CATEGORIES.length];
    const issues = CATEGORY_ISSUES[cat];
    const issue = issues[i % issues.length];
    const sev = SEVERITIES[(i*3+1) % SEVERITIES.length];
    const baseScore = {Low:[8,28],Medium:[32,58],High:[62,79],Critical:[81,98]}[sev];
    const risk = baseScore[0] + Math.floor(Math.random()*(baseScore[1]-baseScore[0]));
    const lat = DEMO_CENTER.lat + (Math.random()-0.5)*0.09;
    const lng = DEMO_CENTER.lng + (Math.random()-0.5)*0.09;
    list.push({
      id: uid(),
      report_code: 'CVL-2026-' + pad(i+1,5),
      issue, category: cat,
      description:'', ai_description: aiDescriptionFor(issue,cat,sev),
      severity: sev, confidence: 0.75+Math.random()*0.22, risk_score: risk,
      latitude: lat, longitude: lng, location_name: `Ward ${1+(i%12)}, Coimbatore`,
      image_url:'', status: statuses[i % statuses.length],
      department: DEPARTMENTS[i % DEPARTMENTS.length],
      community_confirmations: Math.floor(Math.random()*20),
      created_at: new Date(now - (15-i)*86400000*1.3).toISOString(),
      updated_at: new Date(now - (15-i)*40000000).toISOString(),
      is_demo: true, suggested_action: suggestedActionFor(cat)
    });
  }
  return list;
}
function aiDescriptionFor(issue,cat,sev){
  const t = {
    'Road Infrastructure':'A road surface defect has been detected. The damaged area may create a potential hazard for vehicles and two-wheelers, especially in low-visibility conditions.',
    'Waste Management':'Accumulated solid waste has been identified at this location, posing sanitation and public health risks if left uncollected.',
    'Drainage':'Signs of drain blockage or overflow are visible, which may lead to waterlogging during rainfall and create unsanitary conditions.',
    'Street Lighting':'A non-functional street lighting unit has been identified, which may reduce visibility and safety for pedestrians and vehicles at night.',
    'Water Infrastructure':'Visible water leakage or pipeline damage detected, indicating possible infrastructure failure and water wastage.',
    'Public Safety':'A public safety hazard has been identified that may obstruct pathways or pose risk to nearby pedestrians and property.',
    'Obstruction':'An obstruction on the roadway has been detected, which may disrupt traffic flow and pose a collision risk.',
    'Environmental':'An environmental concern has been identified that may contribute to health or ecological risk if unaddressed.'
  };
  return `${issue} detected. ${t[cat]||t['Road Infrastructure']} Severity estimated as ${sev.toLowerCase()} based on visible extent of the issue.`;
}
function suggestedActionFor(cat){
  const t={
    'Road Infrastructure':'Road maintenance inspection recommended.',
    'Waste Management':'Schedule waste collection and site cleanup.',
    'Drainage':'Dispatch drainage clearance team for inspection.',
    'Street Lighting':'Electrical team inspection for lamp/fixture repair.',
    'Water Infrastructure':'Water department inspection to assess leakage source.',
    'Public Safety':'General maintenance team review recommended.',
    'Obstruction':'Clearance crew dispatch recommended.',
    'Environmental':'Environmental health inspection recommended.'
  };
  return t[cat]||'Field inspection recommended.';
}

/* ---- Demo / fallback AI analysis engine (runs fully client-side) ---- */
function runAiAnalysis(description){
  const desc = (description||'').toLowerCase();
  let cat = null;
  const kwMap = {
    'Road Infrastructure':['pothole','road','crack','asphalt','tar'],
    'Waste Management':['garbage','trash','waste','litter','dump'],
    'Drainage':['drain','sewage','overflow','manhole'],
    'Street Lighting':['light','lamp','streetlight','bulb'],
    'Water Infrastructure':['water','leak','pipe','pipeline'],
    'Public Safety':['tree','wire','fallen','danger','hazard'],
    'Obstruction':['block','obstruct','debris','fallen'],
    'Environmental':['mosquito','stagnant','pollution','smell']
  };
  for(const [c,kws] of Object.entries(kwMap)){
    if(kws.some(k=>desc.includes(k))){ cat = c; break; }
  }
  if(!cat) cat = CATEGORIES[Math.floor(Math.random()*CATEGORIES.length)];
  const issues = CATEGORY_ISSUES[cat];
  const issue = issues[Math.floor(Math.random()*issues.length)];
  const weights=[0.18,0.32,0.32,0.18];
  const r=Math.random(); let acc=0,sevIdx=0;
  for(let i=0;i<weights.length;i++){acc+=weights[i]; if(r<=acc){sevIdx=i;break;}}
  const sev = SEVERITIES[sevIdx];
  const baseScore = {Low:[6,28],Medium:[30,58],High:[60,79],Critical:[80,99]}[sev];
  const risk = baseScore[0] + Math.floor(Math.random()*(baseScore[1]-baseScore[0]));
  const confidence = 0.74 + Math.random()*0.23;
  return {
    issue, category:cat, severity:sev, confidence,
    riskScore: risk,
    description: aiDescriptionFor(issue,cat,sev),
    suggestedAction: suggestedActionFor(cat),
    keywords: [issue.toLowerCase(), cat.toLowerCase().split(' ')[0]]
  };
}

/* ---- Toast ---- */
let toastTimer;
function toast(msg){
  const el=document.getElementById('toast'); el.textContent=msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove('show'),2600);
}

  else if(path.startsWith('/report-details')) renderReportDetails(hash.split('?id=')[1]);
  else if(path==='/admin') renderAdmin();
  else if(path==='/help') renderHelp();
  else renderHome();
}

/* ============================================================
   REPORT FLOW
   ============================================================ */
let rfState = {};
function resetRf(){ rfState = {step:1, imageData:null, description:'', lat:null, lng:null, locLabel:'', analysis:null}; }
resetRf();

function renderReportFlow(){
  app.innerHTML = `<section class="page"><div class="container">
    <div class="section-head">
      <h1 class="page-title">Report a Civic Issue</h1>
      <p class="page-sub">Four quick steps — capture, add details, let AI analyze it, then confirm and submit.</p>
    </div>
    <div class="wizard-track" id="wizTrack"></div>
    <div class="report-panel" id="rfBody"></div>
  </div></section>`;
  drawWizardTrack();
  drawRfStep();
}
function drawWizardTrack(){
  const labels=['Capture','Details','Analyze','Confirm'];
  let html='';
  labels.forEach((l,i)=>{
    const n=i+1;
    const cls = n<rfState.step?'done':(n===rfState.step?'active':'');
    html += `<div class="wz-step ${cls}"><div class="wz-dot">${n<rfState.step?'✓':n}</div><div class="wz-label">${l}</div></div>`;
    if(i<labels.length-1) html += `<div class="wz-line"></div>`;
  });
  document.getElementById('wizTrack').innerHTML = html;
}
function drawRfStep(){
  const body = document.getElementById('rfBody');
  if(rfState.step===1){
    body.innerHTML = `
      ${rfState.imageData ? `
        <div class="preview-wrap">
          <img src="${rfState.imageData}" alt="Uploaded civic issue photo preview">
          <button class="preview-remove" onclick="rfRemoveImage()" aria-label="Remove image">✕</button>
        </div>` : `
        <div class="dropzone" id="dz" tabindex="0" role="button" aria-label="Upload or drag and drop an image">
          <div class="dz-icon">📤</div>
          <p><strong>Drop an image here</strong> or click to upload</p>
          <p class="dz-sub">JPG, PNG or WEBP · or use your camera on mobile</p>
        </div>
        <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp" capture="environment" style="display:none">
      `}
      <div class="wizard-nav">
        <span></span>
        <button class="btn btn-primary" id="rfNext1" ${rfState.imageData?'':'disabled'} onclick="rfState.step=2; drawWizardTrack(); drawRfStep();">Continue →</button>
      </div>`;
    if(!rfState.imageData){
      const dz=document.getElementById('dz'), input=document.getElementById('fileInput');
      dz.addEventListener('click',()=>input.click());
      dz.addEventListener('keydown',e=>{if(e.key==='Enter')input.click();});
      dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('drag');});
      dz.addEventListener('dragleave',()=>dz.classList.remove('drag'));
      dz.addEventListener('drop',e=>{e.preventDefault();dz.classList.remove('drag');handleFile(e.dataTransfer.files[0]);});
      input.addEventListener('change',e=>handleFile(e.target.files[0]));
    }
  }
  else if(rfState.step===2){
    body.innerHTML = `
      <div class="field">
        <label for="descInput">Issue description (optional)</label>
        <textarea id="descInput" rows="3" placeholder="e.g. Large pothole near the bus stop, getting worse after rain">${rfState.description}</textarea>
      </div>
      <div class="field">
        <label>Location</label>
        <div class="loc-row">
          <button class="btn btn-ghost btn-sm" onclick="useMyLocation()">📍 Use my current location</button>
          <button class="btn btn-outline btn-sm" onclick="useManualLocation()">Select manually (demo)</button>
        </div>
        ${rfState.lat ? `<div class="loc-chip" style="margin-top:10px;display:inline-block;">${rfState.locLabel} · ${rfState.lat.toFixed(5)}, ${rfState.lng.toFixed(5)}</div>` : ''}
      </div>
      <div class="wizard-nav">
        <button class="btn btn-outline" onclick="rfState.step=1; drawWizardTrack(); drawRfStep();">← Back</button>
        <button class="btn btn-primary" ${rfState.lat?'':'disabled'} onclick="rfState.description=document.getElementById('descInput').value; rfState.step=3; drawWizardTrack(); drawRfStep();">Continue →</button>
      </div>`;
  }
  else if(rfState.step===3){
    if(!rfState.analysis){
      body.innerHTML = `
        <div class="card ai-scan">
          <p style="font-weight:700;font-size:15px;">Analyze with CivicLens AI</p>
          <p class="page-sub" style="margin:8px auto 20px;">Our vision model will identify the issue, estimate severity and calculate a civic risk score.</p>
          <button class="btn btn-primary" onclick="startAiScan()">Analyze with CivicLens AI 🧠</button>
        </div>
        <div class="wizard-nav"><button class="btn btn-outline" onclick="rfState.step=2; drawWizardTrack(); drawRfStep();">← Back</button><span></span></div>`;
    }
  }
  else if(rfState.step===4){
    const a = rfState.analysis;
    const sevClass = {Low:'badge-low',Medium:'badge-med',High:'badge-high',Critical:'badge-crit'}[a.severity];
    body.innerHTML = `
      <div class="card" style="padding:24px;">
        <h3 style="margin-bottom:16px;">Confirm your report</h3>
        <img src="${rfState.imageData}" alt="Issue photo" style="border-radius:10px;max-height:200px;object-fit:cover;width:100%;margin-bottom:18px;">
        <div class="confirm-list">
          <div class="confirm-item"><div class="k">Report ID</div><div class="v">${nextReportCode(loadReports())}</div></div>
          <div class="confirm-item"><div class="k">Issue</div><div class="v">${a.issue}</div></div>
          <div class="confirm-item"><div class="k">Category</div><div class="v">${a.category}</div></div>
          <div class="confirm-item"><div class="k">Severity</div><div class="v"><span class="badge ${sevClass}">${a.severity.toUpperCase()}</span></div></div>
          <div class="confirm-item"><div class="k">Risk Score</div><div class="v">${a.riskScore} / 100</div></div>
          <div class="confirm-item"><div class="k">Location</div><div class="v">${rfState.locLabel}</div></div>
        </div>
        <div class="desc-block"><b>AI Description:</b> ${a.description}<br><br><b>Suggested Action:</b> ${a.suggestedAction}</div>
        ${rfState.description ? `<div class="desc-block"><b>Your note:</b> ${rfState.description}</div>`:''}
      </div>
      <div id="dupSlot"></div>
      <div class="wizard-nav">
        <button class="btn btn-outline" onclick="rfState.step=3; rfState.analysis=null; drawWizardTrack(); drawRfStep();">← Re-analyze</button>
        <button class="btn btn-primary" onclick="submitReport()">Submit Civic Report ✓</button>
      </div>`;
    checkDuplicate();
  }
  else if(rfState.step===5){
    const code = rfState.newCode;
    body.innerHTML = `
      <div class="card success-wrap">
        <div class="success-badge">✓</div>
        <h2>Report Submitted Successfully</h2>
        <div class="success-id">${code}</div>
        <p class="page-sub" style="margin:0 auto;">Status: <span class="badge badge-low">REPORTED</span></p>
        <div class="hero-actions" style="justify-content:center;margin-top:26px;">
          <button class="btn btn-primary" onclick="location.hash='#/my-reports'">View My Report</button>
          <button class="btn btn-outline" onclick="location.hash='#/map'">View Civic Map</button>
        </div>
      </div>`;
  }
}
function handleFile(file){
  if(!file) return;
  const okTypes=['image/jpeg','image/png','image/webp'];
  if(!okTypes.includes(file.type)){ toast('Unsupported file type — please use JPG, PNG or WEBP.'); return; }
  if(file.size > 12*1024*1024){ toast('Image is too large (max 12MB).'); return; }
  const reader = new FileReader();
  reader.onload = e=>{ rfState.imageData = e.target.result; drawRfStep(); };
  reader.onerror = ()=> toast('Could not read that image — please try another file.');
  reader.readAsDataURL(file);
}
function rfRemoveImage(){ rfState.imageData=null; drawRfStep(); }
function useMyLocation(){
  if(!navigator.geolocation){ toast('Geolocation is not supported in this browser.'); return; }
  toast('Requesting location permission…');
  navigator.geolocation.getCurrentPosition(pos=>{
    rfState.lat = pos.coords.latitude; rfState.lng = pos.coords.longitude; rfState.locLabel='Current Location';
    drawRfStep(); toast('Location captured.');
  }, err=>{ toast('Location permission denied — you can select manually instead.'); }, {timeout:8000});
}
function useManualLocation(){
  rfState.lat = DEMO_CENTER.lat + (Math.random()-0.5)*0.06;
  rfState.lng = DEMO_CENTER.lng + (Math.random()-0.5)*0.06;
  rfState.locLabel = 'Selected on map (demo)';
  drawRfStep();
}
function startAiScan(){
  const body = document.getElementById('rfBody');
  const logs = ['Analyzing image...','Identifying issue...','Estimating severity...','Calculating civic risk...','Generating report...'];
  body.innerHTML = `<div class="card ai-scan"><div class="pulse">🧠</div><p style="font-weight:700;">AI Analysis in progress</p><div class="scan-log" id="scanLog"></div></div>`;
  const logEl = document.getElementById('scanLog');
  logs.forEach((l,i)=>{
    setTimeout(()=>{
      const d=document.createElement('div'); d.className='ok'; d.style.animationDelay='0s'; d.textContent=l;
      logEl.appendChild(d);
      if(i===logs.length-1){
        setTimeout(()=>{
          rfState.analysis = runAiAnalysis(rfState.description);
          rfState.step = 4; drawWizardTrack(); drawRfStep();
        }, 550);
      }
    }, i*480);
  });
}
function checkDuplicate(){
  const reports = loadReports();
  const a = rfState.analysis;
  const near = reports.find(r => r.category===a.category && rfState.lat && haversine(rfState.lat, rfState.lng, r.latitude, r.longitude) < 400);
  const slot = document.getElementById('dupSlot');
  if(near){
    slot.innerHTML = `
      <div class="related-box">
        <h4>⚠️ Potentially Related Issue Found</h4>
        <p>This report may be related to an existing civic issue nearby. <em>AI-assisted / prototype duplicate detection — not an exact match guarantee.</em></p>
        <p style="font-size:13px;"><b>Existing Issue:</b> ${near.report_code} · <b>Distance:</b> Nearby · <b>Community Reports:</b> ${near.community_confirmations}</p>
        <div style="display:flex;gap:10px;">
          <button class="btn btn-ghost btn-sm" onclick="submitReport()">Add My Report Anyway</button>
          <button class="btn btn-outline btn-sm" onclick="location.hash='#/report-details?id=${near.id}'">View Existing Issue</button>
        </div>
      </div>`;
  } else slot.innerHTML='';
}
function submitReport(){
  const reports = loadReports();
  const a = rfState.analysis;
  const code = nextReportCode(reports);
  const report = {
    id: uid(), report_code: code, issue: a.issue, category: a.category,
    description: rfState.description||'', ai_description: a.description,
    severity: a.severity, confidence: a.confidence, risk_score: a.riskScore,
    latitude: rfState.lat, longitude: rfState.lng, location_name: rfState.locLabel,
    image_url: rfState.imageData, status:'Reported', department:'',
    community_confirmations:0, created_at: new Date().toISOString(), updated_at: new Date().toISOString(),
    is_demo:false, suggested_action: a.suggestedAction
  };
  reports.unshift(report); saveReports(reports);
  rfState.newCode = code; rfState.step = 5;
  drawWizardTrack(); drawRfStep();
}

let leafletMap=null, markerLayer=null;
let mapFilters = {severity:'All', category:'All'};
function renderMap(){
  app.innerHTML = `<section class="page map-page"><div class="container">
    <div class="section-head">
      <h1 class="page-title">Civic Map</h1>

    </div>

      <div class="chip-group" id="sevFilters">
        ${['All','Critical','High','Medium','Low'].map(s=>`<button class="chip ${s==='All'?'active':''}" data-sev="${s}">${s}</button>`).join('')}
      </div>
      <div class="chip-group" id="catFilters">
        ${['All','Road Infrastructure','Waste Management','Drainage','Street Lighting','Water Infrastructure','Other'].map(c=>`<button class="chip ${c==='All'?'active':''}" data-cat="${c}">${c==='Road Infrastructure'?'Road':c==='Waste Management'?'Waste':c==='Water Infrastructure'?'Water':c}</button>`).join('')}
      </div>
      <button class="btn btn-ghost btn-sm" onclick="mapUseMyLocation()">📍 Use My Location</button>
    </div>
    <div id="map" role="application" aria-label="Civic issue map"></div>
  </div></section>`;
  document.querySelectorAll('#sevFilters .chip').forEach(b=>b.addEventListener('click',()=>{
    document.querySelectorAll('#sevFilters .chip').forEach(x=>x.classList.remove('active')); b.classList.add('active');
    mapFilters.severity=b.dataset.sev; drawMarkers();
  }));
  document.querySelectorAll('#catFilters .chip').forEach(b=>b.addEventListener('click',()=>{
    document.querySelectorAll('#catFilters .chip').forEach(x=>x.classList.remove('active')); b.classList.add('active');
    mapFilters.category=b.dataset.cat; drawMarkers();
  }));
  setTimeout(initLeaflet, 20);
}
function initLeaflet(){
  const el = document.getElementById('map'); if(!el) return;
  try{
    leafletMap = L.map('map',{scrollWheelZoom:true}).setView([DEMO_CENTER.lat, DEMO_CENTER.lng], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
      attribution:'&copy; OpenStreetMap contributors', maxZoom:19
    }).addTo(leafletMap);
    markerLayer = L.layerGroup().addTo(leafletMap);
    drawMarkers();
  }catch(e){
    el.innerHTML = `<div class="empty-state"><div class="ic">🗺️</div><p>Map failed to load. Check your network connection and try again.</p></div>`;
  }
}
function drawMarkers(){
  if(!markerLayer) return;
  markerLayer.clearLayers();
  const reports = loadReports().filter(r=>r.latitude&&r.longitude);
  reports.filter(r=>{
    const sevOk = mapFilters.severity==='All' || r.severity===mapFilters.severity;
    const catOk = mapFilters.category==='All' || r.category===mapFilters.category || (mapFilters.category==='Other' && !['Road Infrastructure','Waste Management','Drainage','Street Lighting','Water Infrastructure'].includes(r.category));
    return sevOk && catOk;
  }).forEach(r=>{
    const color = SEVERITY_COLOR[r.severity]||'#999';
    const marker = L.circleMarker([r.latitude, r.longitude],{
      radius: r.severity==='Critical'?11:r.severity==='High'?9:7,
      fillColor: color, color:'#0a0d16', weight:2, fillOpacity:0.9
    });
    marker.bindPopup(`<div class="map-popup">
      <h4>${r.issue}</h4>
      <span class="badge" style="background:${color}22;color:${color};">${r.severity.toUpperCase()}</span>
      <p class="popup-meta">Risk Score: <b>${r.risk_score}</b></p>
      <p class="popup-meta">Reports: ${r.community_confirmations||0} · Status: ${r.status.toUpperCase()}</p>
      <a class="view-link" href="#/report-details?id=${r.id}">View Details →</a>
    </div>`);
    marker.addTo(markerLayer);
  });
}
function mapUseMyLocation(){
  if(!navigator.geolocation){ toast('Geolocation not supported.'); return; }
  navigator.geolocation.getCurrentPosition(pos=>{
    leafletMap.setView([pos.coords.latitude,pos.coords.longitude],14);
    L.marker([pos.coords.latitude,pos.coords.longitude]).addTo(markerLayer).bindPopup('You are here').openPopup();
  }, ()=> toast('Location permission denied.'));
}

function drawAdminAnalytics(){
  const reports = loadReports();
  const wrap = document.getElementById('adminBody');
  const byCat = {}; CATEGORIES.forEach(c=>byCat[c]=0);
  reports.forEach(r=>{byCat[r.category]=(byCat[r.category]||0)+1;});
  const total = reports.length||1;
  const catRows = Object.entries(byCat).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1])
    .map(([c,v])=>({label:c, pct:Math.round(v/total*100), color:'#3b6bff'}));
  const bySev = {}; SEVERITIES.forEach(s=>bySev[s]=0); reports.forEach(r=>bySev[r.severity]++);
  const sevRows = SEVERITIES.slice().reverse().map(s=>({label:s, pct:Math.round(bySev[s]/total*100), color:SEVERITY_COLOR[s]}));
  const byStatus = {}; STATUS_FLOW.forEach(s=>byStatus[s]=0); reports.forEach(r=>byStatus[r.status]++);
  const statusRows = STATUS_FLOW.map(s=>({label:s, pct:Math.round(byStatus[s]/total*100), color:'#8b5cf6'}));

  // hotspots: cluster by rounding coords to ~1.5km grid
  const clusters={};
  reports.forEach(r=>{
    if(!r.latitude) return;
    const key = r.latitude.toFixed(2)+','+r.longitude.toFixed(2);
    clusters[key] = clusters[key] || {count:0, cats:{}, lat:r.latitude, lng:r.longitude};
    clusters[key].count++;
    clusters[key].cats[r.category]=(clusters[key].cats[r.category]||0)+1;
  });
  const hotspots = Object.values(clusters).filter(c=>c.count>=2).sort((a,b)=>b.count-a.count).slice(0,6)
    .map(c=>{
      const topCat = Object.entries(c.cats).sort((a,b)=>b[1]-a[1])[0][0];
      return {cat:topCat, count:c.count};
    });

  wrap.innerHTML = `
    <div class="analytics-grid">
      <div class="card chart-card"><h3>Issue Distribution by Category</h3>${barRowsHtml(catRows)}</div>
      <div class="card chart-card"><h3>Severity Distribution</h3>${barRowsHtml(sevRows)}</div>
      <div class="card chart-card"><h3>Issue Status</h3>${barRowsHtml(statusRows)}</div>
      <div class="card chart-card">
        <h3>Civic Hotspots <span style="font-weight:400;color:var(--text-faint);font-size:12px;">(prototype clustering)</span></h3>
        ${hotspots.length? hotspots.map(h=>`<div style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px;"><span>${h.cat} Hotspot</span><b>${h.count} reports</b></div>`).join('') : '<p style="color:var(--text-faint);font-size:13px;">No hotspots detected yet — need multiple nearby reports.</p>'}
        <p class="tooltip-note" style="margin-top:10px;">ℹ️ Hotspots are a prototype visualization based on report density, not statistically validated geographic analysis.</p>
      </div>
    </div>`;
}
function barRowsHtml(rows){
  return rows.map(r=>`<div class="bar-row"><span>${r.label}</span><div class="bar-track"><div class="bar-fill" style="width:${r.pct}%;background:${r.color};"></div></div><span>${r.pct}%</span></div>`).join('');
}
function seedMoreDemo(){
  if(!confirm('This resets all reports to fresh demo seed data. Continue?')) return;
  localStorage.removeItem(STORE_KEY); localStorage.removeItem(CONFIRM_KEY);
  toast('Demo data reseeded.'); renderAdmin();
}

navigate();
</script>
